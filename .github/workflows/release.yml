name: Release image

# Builds the Raspberry Pi image (linux/arm64) and pushes it to GHCR as
# ghcr.io/larze88/lifeos-aarch64:<version>. Triggered by a tag "v<version>" that must
# match package.json, or manually. See CLAUDE.md "Release".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: LIFEOS_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/larze88/lifeos-aarch64:${{ steps.version.outputs.version }}
            ghcr.io/larze88/lifeos-aarch64:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
